<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario</title>

  <!-- Vinculamos tu archivo CSS externo -->
  <link rel="stylesheet" href="style.css">

  <!-- Google reCAPTCHA v2 Script -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <!-- SDK de EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script type="text/javascript">
      // Inicializar EmailJS con tu Clave Pública
      (function() {
          emailjs.init({
              publicKey: "lZVsfMUF-29Wv_YXa",
          });
      })();
  </script>

  <!-- Tu archivo de validación (y envío) -->
  <script src="validación.js" defer></script>
</head>

<body>

  <div class="caja-formulario">
    <h2>Registro de Usuario</h2>

    <!-- Agregué un id="contact-form" para que te sea fácil seleccionarlo desde tu JS -->
    <form id="contact-form" onsubmit="return validar(event)" novalidate>
      
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <!-- ¡Importante! Añadido name="nombre" para que EmailJS lo detecte -->
        <input type="text" id="nombre" name="nombre" placeholder="Ej. Nombre Apellido" required>
        <p id="nombre_válido" class="oculto"></p>
      </div>

      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input type="email" name="email" id="email" placeholder="nombre@ejemplo.com" required>
        <p id="email_válido" class="oculto"></p>
      </div>

      <div class="campo">
        <label for="asunto">Asunto</label>
        <input type="text" name="asunto" id="asunto" placeholder="Ej. Consulta sobre el servicio" required>
        <p id="asunto_válido" class="oculto"></p>
      </div>

      <!-- Widget de reCAPTCHA v2 -->
      <div class="campo-recaptcha">
        <div class="g-recaptcha" data-sitekey="6Ledk_ctAAAAACkwpU461eTSJu1BtCFAqmZ_cWk4"></div>
      </div>

      <button type="submit">Enviar Registro</button>

    </form>
  </div>

</body>

</html>
