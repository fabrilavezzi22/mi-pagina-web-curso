<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario</title>

  <!-- Vinculamos tu archivo CSS externo -->
  <link rel="stylesheet" href="style.css">

  <!-- Google reCAPTCHA v2 Script -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body>

  <div class="caja-formulario">
    <h2>Registro de Usuario</h2>

    <form>
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" placeholder="Ej. Nombre Apellido" required>
      </div>

      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="nombre@ejemplo.com" required>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required>
      </div>

      <!-- Widget de reCAPTCHA v2 -->
      <div class="campo-recaptcha">
        <div class="g-recaptcha" data-sitekey="6Ledk_ctAAAAACkwpU461eTSJu1BtCFAqmZ_cWk4"></div>
      </div>

      <button type="submit">Enviar Registro</button>
    </form>
  </div>

</body>

</html>
